# Ollama's side of "one mind, one model" — a drop-in for the ollama service.
#
# The single-mind locks stop Sali from opening a second reasoning path. This stops the MODEL SERVER
# from doing it underneath him: ollama keys a runner by (model, runner-affecting options), so two
# parallel slots or a permissive loaded-model ceiling can put two copies of a 15GB model on a 12GB
# card no matter how disciplined Sali is.
#
#   OLLAMA_NUM_PARALLEL=1       one generation slot per runner — never two at once
#   OLLAMA_MAX_LOADED_MODELS=2  the chat model + the CPU-only embedder. Never a third.
#
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp systemd/ollama-sali.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# `sali status` reports actual residency from `ollama ps`, so a drop-in lost to a package upgrade
# shows up as an observation rather than an assumption.
[Service]
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
